name: Android code quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-quality:
    name: Android lint, tests, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17 and Gradle dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties
            **/*.gradle.kts
            gradle/libs.versions.toml

      - name: Run Android checks and build debug APK
        run: >-
          ./gradlew :app:lintDebug :app:lintRelease
          :app:testDebugUnitTest :app:assembleDebug
          --no-daemon --max-workers=2

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreFit-debug.apk
          path: app/build/outputs/apk/debug/LibreFit-debug.apk
          if-no-files-found: error
