name: Android code quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-quality:
    name: Android lint, tests, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17 and Gradle dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties
            **/*.gradle.kts
            gradle/libs.versions.toml

      - name: Run Android checks and build debug APK
        run: >-
          ./gradlew :app:lintDebug :app:lintRelease
          :app:testDebugUnitTest :app:assembleDebug
          --no-daemon --max-workers=2

      - name: Upload SonarQube analysis inputs
        uses: actions/upload-artifact@v4
        with:
          name: android-sonar-inputs
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes/**/*.class
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreFit-debug.apk
          path: app/build/outputs/apk/debug/LibreFit-debug.apk
          if-no-files-found: error

  sonarqube:
    name: SonarQube analysis
    needs: android-quality
    if: >-
      vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Android analysis inputs
        uses: actions/download-artifact@v4
        with:
          name: android-sonar-inputs
          path: app/build

      - name: Verify analysis inputs
        run: |
          set -euo pipefail
          test -f app/build/reports/lint-results-debug.xml
          test -d app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes

      - name: Verify SonarQube token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Set the SONAR_TOKEN repository secret to enable SonarQube analysis."
            exit 1
          fi

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  sonarqube-skipped:
    name: SonarQube skipped (reason)
    if: >-
      vars.SONAR_ORGANIZATION == '' || vars.SONAR_PROJECT_KEY == '' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain missing SonarQube configuration
        env:
          SONAR_ORGANIZATION_CONFIGURED: ${{ vars.SONAR_ORGANIZATION != '' }}
          SONAR_PROJECT_CONFIGURED: ${{ vars.SONAR_PROJECT_KEY != '' }}
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "$IS_FORK_PULL_REQUEST" == "true" ]]; then
            echo "::notice title=SonarQube skipped::Fork pull requests do not receive SONAR_TOKEN."
          fi
          if [[ "$SONAR_ORGANIZATION_CONFIGURED" != "true" || "$SONAR_PROJECT_CONFIGURED" != "true" ]]; then
            echo "::notice title=SonarQube skipped::Configure SONAR_ORGANIZATION and SONAR_PROJECT_KEY repository variables to enable hosted analysis."
          fi
