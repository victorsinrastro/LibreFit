# SonarQube Cloud analysis configuration. Organization and project key are
# provided by the GitHub Actions repository variables.
sonar.sourceEncoding=UTF-8
sonar.sources=app/src/main
sonar.tests=app/src/test,app/src/androidTest
sonar.test.inclusions=**/*Test.kt,**/*Tests.kt
sonar.exclusions=**/build/**,**/.gradle/**,app/src/main/res/**
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes,app/build/tmp/kotlin-classes/debug
sonar.newCode.referenceBranch=main
